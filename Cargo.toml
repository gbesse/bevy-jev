[package]
name = "bevy-jev"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A non-blocking, provenance-checked Jev decision plugin for Bevy"
license = "MIT"
repository = "https://github.com/gbesse/bevy-jev"
keywords = ["bevy", "game-ai", "jev", "decision-making"]
categories = ["game-development"]

[features]
default = ["gateway"]
gateway = ["dep:reqwest"]

[dependencies]
bevy_app = { version = "0.19.1", default-features = false }
bevy_ecs = { version = "0.19.1", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
reqwest = { version = "0.12", optional = true, default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
bevy_app = { version = "0.19.1", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
